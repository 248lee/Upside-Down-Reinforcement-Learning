# The program to run
program: new_udrl.py

# Method can be grid, random or bayes
method: random

# Project this sweep is part of
project: sweep_udrl_ablation



# Parameters space to search
parameters:
  gamma:
    distribution: uniform
    min: 0.98
    max: 0.999
  learning_rate:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.01
  ovn_update_rate:
    distribution: log_uniform_values
    min: 0.00001
    max: 0.01
  batch_size:
    values: [64, 256, 512, 1024]
  n_rollout_steps_per_iter_add:
    values: [8, 400, 800]
  return_scale:
    distribution: log_uniform_values
    min: 0.001
    max: 1
  replay_size:
    values: [10000, 100000, 500000]